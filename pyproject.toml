[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-beautifulsoup4"
version = "0.1.0"
description = "Beautiful Soup-compatible HTML trees with Mojo parsing and selector kernels"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
